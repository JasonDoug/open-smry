name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Sync Python Backend Dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run Polyglot Verification & Test Suite
        run: npm test
